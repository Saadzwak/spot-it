<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spot.it — App iOS</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --canvas: #F7F5F1;
    --surface: #FFFFFF;
    --ink: #17130F;
    --ink-2: #5C544C;
    --ink-3: #9C9087;
    --line: rgba(23,19,15,0.08);
    --accent: #F9532E;
    --accent-soft: color-mix(in srgb, var(--accent) 13%, #fff);
    --accent-ink: color-mix(in srgb, var(--accent) 74%, #2a0f08);
    --font-display: 'Clash Display', 'General Sans', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --r-card: 22px;
    --shadow-sm: 0 2px 8px rgba(23,19,15,0.06), 0 1px 2px rgba(23,19,15,0.04);
    --shadow-card: 0 18px 40px -12px rgba(23,19,15,0.28), 0 4px 12px rgba(23,19,15,0.08);
    --spring: cubic-bezier(.34,1.4,.5,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% -10%, #2b251f 0%, #1a1612 55%, #121009 100%);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: var(--font-body); }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  #stageWrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { transform-origin: center center; }

  /* animations */
  @keyframes spotRipple { 0% { transform: scale(0.6); opacity: 0.7; } 100% { transform: scale(2.2); opacity: 0; } }
  @keyframes spotGlow { 0%,100% { opacity: 0.14; transform: scale(0.9); } 50% { opacity: 0.32; transform: scale(1.15); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes proxPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.04); opacity: 0.85; } }
  .prox-ring { animation: proxPulse 3.5s ease-in-out infinite; }
  /* resting state is the visible end-state; animations only play the entrance */
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-up, .sheet-enter { animation: sheetUp .42s var(--spring); }
  @keyframes stepIn { from { opacity: 0; transform: translateY(10px); } }
  .step-enter { animation: stepIn .35s ease; }
  @keyframes notifIn { from { opacity: 0; transform: translateY(-22px) scale(0.96); } }
  .notif-enter { animation: notifIn .5s var(--spring); }
  @media (prefers-reduced-motion: reduce) { .sheet-up, .sheet-enter, .step-enter, .notif-enter, .prox-ring, .spot-ripple { animation: none !important; } }
  @keyframes notifGlow { 0%,100% { opacity: 0.28; } 50% { opacity: 0.5; } }
  .notif-glow { animation: notifGlow 2.4s ease-in-out infinite; }
  .round-btn:active { transform: scale(0.9); }

  /* range slider */
  .spot-range { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; background: var(--line); outline: none; }
  .spot-range::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 4px 12px rgba(249,83,46,0.4); border: 3px solid #fff; }
  .spot-range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 3px solid #fff; }

  /* external screen navigator */
  #rail { position: fixed; left: 18px; top: 50%; transform: translateY(-50%); z-index: 9; display: flex; flex-direction: column; gap: 6px; }
  #rail .rail-title { font-family: var(--font-display); font-weight: 600; font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; padding-left: 4px; }
  .rail-btn { display: flex; align-items: center; gap: 9px; padding: 9px 14px 9px 11px; border-radius: 12px; border: none; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.82); font-family: var(--font-body); font-weight: 600; font-size: 13px; cursor: pointer; transition: background .18s ease, color .18s; white-space: nowrap; }
  .rail-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .rail-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  @media (max-width: 720px) { #rail { display: none; } }
</style>
</head>
<body>
  <div id="rail">
    <div class="rail-title">Spot.it · écrans</div>
    <button class="rail-btn" onclick="window.__spotGo&&window.__spotGo('onboarding')"><span class="dot"></span>Onboarding</button>
    <button class="rail-btn" onclick="window.__spotGo&&window.__spotGo('discover')"><span class="dot"></span>Découvrir</button>
    <button class="rail-btn" onclick="window.__spotGo&&window.__spotGo('map')"><span class="dot"></span>Carte</button>
    <button class="rail-btn" onclick="window.__spotGo&&window.__spotGo('detail')"><span class="dot"></span>Détail offre</button>
    <button class="rail-btn" onclick="window.__spotGo&&window.__spotGo('wishlist')"><span class="dot"></span>Wishlist</button>
    <button class="rail-btn" onclick="window.__spotGo&&window.__spotGo('profile')"><span class="dot"></span>Profil</button>
    <button class="rail-btn" onclick="window.__spotGo&&window.__spotGo('notif')"><span class="dot"></span>Notification</button>
  </div>

  <div id="stageWrap"><div id="stage"></div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="app/data.jsx"></script>
  <script type="text/babel" src="app/icons.jsx"></script>
  <script type="text/babel" src="app/ui.jsx"></script>
  <script type="text/babel" src="app/nav.jsx"></script>
  <script type="text/babel" src="app/screen-onboarding.jsx"></script>
  <script type="text/babel" src="app/screen-discover.jsx"></script>
  <script type="text/babel" src="app/screen-map.jsx"></script>
  <script type="text/babel" src="app/screen-detail.jsx"></script>
  <script type="text/babel" src="app/screen-wishlist.jsx"></script>
  <script type="text/babel" src="app/screen-profile.jsx"></script>
  <script type="text/babel" src="app/extras.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>

  <script type="text/babel" data-presets="react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#F9532E",
      "displayFont": "Clash Display",
      "mapDark": false,
      "cardRadius": 22
    }/*EDITMODE-END*/;

    function Root() {
      const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const wrapStyle = {
        '--accent': tw.accent,
        '--font-display': `'${tw.displayFont}', 'Clash Display', system-ui, sans-serif`,
        '--r-card': tw.cardRadius + 'px',
      };
      return (
        <React.Fragment>
          <div style={wrapStyle}>
            <SpotApp tweaks={tw} />
          </div>
          <TweaksPanel>
            <TweakSection label="Couleur" />
            <TweakColor label="Accent" value={tw.accent}
              options={['#F9532E', '#D6432A', '#FF6F4B', '#E0466B']}
              onChange={(v) => setTweak('accent', v)} />
            <TweakSection label="Typographie" />
            <TweakRadio label="Titres" value={tw.displayFont}
              options={['Clash Display', 'General Sans']}
              onChange={(v) => setTweak('displayFont', v)} />
            <TweakSection label="Carte" />
            <TweakToggle label="Mode sombre carte" value={tw.mapDark}
              onChange={(v) => setTweak('mapDark', v)} />
            <TweakSection label="Formes" />
            <TweakSlider label="Rayon des cartes" value={tw.cardRadius} min={12} max={30} step={1} unit="px"
              onChange={(v) => setTweak('cardRadius', v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('stage')).render(<Root />);

    // fit-to-viewport scaling
    function fit() {
      const railed = window.innerWidth > 720 ? 220 : 24;
      const s = Math.min((window.innerWidth - railed) / 390, (window.innerHeight - 40) / 844, 1.12);
      document.getElementById('stage').style.transform = 'scale(' + Math.max(0.42, s) + ')';
    }
    window.addEventListener('resize', fit);
    setTimeout(fit, 60); setTimeout(fit, 400);
  </script>
</body>
</html>
